server:
  port: 8080

spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/sandboxdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:toor}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:promptdb-dev-secret-32-chars-2026}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
