spring:

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/sandboxdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:toor}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration