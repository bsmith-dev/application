<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edit prompt' : 'New prompt')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <p class="breadcrumb">
        <a th:href="@{/groups}">Groups</a> / <a th:href="@{/groups/{id}(id=${group.groupId})}" th:text="${group.name}">Name</a> /
        <a th:href="@{/groups/{id}/prompts(id=${group.groupId})}">Prompts</a> / <span th:text="${editing} ? 'Edit' : 'New'">New</span>
    </p>
    <div th:replace="~{fragments/alerts :: messages}"></div>

    <div class="card" style="max-width:680px;">
        <h1 style="font-size:1.2rem;margin-top:0;" th:text="${editing} ? 'Edit prompt' : 'New prompt'">Prompt</h1>

        <form method="post"
              th:action="${editing} ? @{/groups/{gid}/prompts/{pid}(gid=${group.groupId},pid=${promptId})} : @{/groups/{id}/prompts(id=${group.groupId})}"
              th:object="${promptForm}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="title">Title</label>
                <input id="title" type="text" th:field="*{title}" th:errorclass="input-error" autofocus="autofocus"/>
                <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Invalid</p>
            </div>

            <div class="field">
                <label for="content">Content</label>
                <textarea id="content" rows="10" th:field="*{content}" th:errorclass="input-error"></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Invalid</p>
            </div>

            <div class="actions">
                <button type="submit">Save</button>
                <a class="button secondary" th:href="@{/groups/{id}/prompts(id=${group.groupId})}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
