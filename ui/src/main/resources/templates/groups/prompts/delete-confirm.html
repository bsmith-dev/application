<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delete prompt')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <p class="breadcrumb">
        <a th:href="@{/groups}">Groups</a> / <a th:href="@{/groups/{id}(id=${group.groupId})}" th:text="${group.name}">Name</a> /
        <a th:href="@{/groups/{id}/prompts(id=${group.groupId})}">Prompts</a> / Delete
    </p>
    <div th:replace="~{fragments/alerts :: messages}"></div>

    <div class="card" style="max-width:520px;">
        <h1 style="font-size:1.2rem;margin-top:0;">Delete prompt?</h1>
        <p>You are about to delete <strong th:text="${prompt.title}">Title</strong>. This cannot be undone.</p>

        <form method="post" th:action="@{/groups/{gid}/prompts/{pid}/delete(gid=${group.groupId},pid=${prompt.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="actions">
                <button type="submit" class="danger">Delete prompt</button>
                <a class="button secondary" th:href="@{/groups/{gid}/prompts/{pid}(gid=${group.groupId},pid=${prompt.id})}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
