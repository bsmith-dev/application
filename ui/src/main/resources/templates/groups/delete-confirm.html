<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delete group')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <p class="breadcrumb"><a th:href="@{/groups}">Groups</a> / Delete</p>
    <div th:replace="~{fragments/alerts :: messages}"></div>

    <div class="card" style="max-width:520px;">
        <h1 style="font-size:1.2rem;margin-top:0;">Delete group?</h1>
        <p>You are about to delete <strong th:text="${group.name}">Name</strong> and its memberships and prompts, subject to the API's rules.</p>

        <form method="post" th:action="@{/groups/{id}/delete(id=${group.groupId})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="actions">
                <button type="submit" class="danger">Delete group</button>
                <a class="button secondary" th:href="@{/groups/{id}(id=${group.groupId})}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
