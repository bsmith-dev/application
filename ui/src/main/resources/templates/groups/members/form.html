<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add member · ' + ${group.name})}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <p class="breadcrumb">
        <a th:href="@{/groups}">Groups</a> / <a th:href="@{/groups/{id}(id=${group.groupId})}" th:text="${group.name}">Name</a> /
        <a th:href="@{/groups/{id}/members(id=${group.groupId})}">Members</a> / Add
    </p>
    <div th:replace="~{fragments/alerts :: messages}"></div>

    <div class="card" style="max-width:520px;">
        <h1 style="font-size:1.2rem;margin-top:0;">Add a member</h1>

        <div class="empty-state" th:if="${#lists.isEmpty(candidateMembers)}">
            <p>No registered members are available to add. <a th:href="@{/register}">Register one first.</a></p>
        </div>

        <form method="post" th:action="@{/groups/{id}/members(id=${group.groupId})}" th:object="${groupMemberForm}" th:unless="${#lists.isEmpty(candidateMembers)}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="memberId">Member</label>
                <select id="memberId" th:field="*{memberId}" th:errorclass="input-error">
                    <option value="">Select a member…</option>
                    <option th:each="m : ${candidateMembers}" th:value="${m.memberId}" th:text="${m.username} + ' (' + ${m.email} + ')'">username</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}">Invalid</p>
            </div>

            <div class="field">
                <label for="role">Role in this group</label>
                <select id="role" th:field="*{role}" th:errorclass="input-error">
                    <option th:each="r : ${T(app.prompts.ui.api.dto.Role).values()}" th:value="${r}" th:text="${r}">ROLE</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Invalid</p>
            </div>

            <div class="actions">
                <button type="submit">Add member</button>
                <a class="button secondary" th:href="@{/groups/{id}/members(id=${group.groupId})}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
