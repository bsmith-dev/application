<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create organization')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <div class="auth-container">
        <h1>Create an organization</h1>
        <p class="hint">Every member belongs to an organization. Create one first, then register members into it.</p>
        <div th:replace="~{fragments/alerts :: messages}"></div>

        <div th:if="${createdOrganization}" class="card">
            <p><strong>Organization created:</strong> <span th:text="${createdOrganization.name}">Name</span></p>
            <p class="hint">Organization ID (you'll need this to register members):</p>
            <p class="prompt-content" th:text="${createdOrganization.organizationId}">id</p>
            <a class="button" th:href="@{/register(organizationId=${createdOrganization.organizationId})}">Register the first member</a>
        </div>

        <form method="post" th:action="@{/organizations/bootstrap}" th:object="${organizationForm}" th:unless="${createdOrganization}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="name">Organization name</label>
                <input id="name" type="text" th:field="*{name}" th:errorclass="input-error" autofocus="autofocus"/>
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid</p>
            </div>

            <div class="actions">
                <button type="submit">Create organization</button>
                <a class="button secondary" th:href="@{/login}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
