<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not found')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <div class="error-page">
        <div class="code">404</div>
        <h1>We couldn't find that</h1>
        <p>The resource may have been deleted, or the link may be out of date.</p>
        <p class="detail" th:text="${detail}">Detail</p>
        <p><a th:href="@{/dashboard}">Back to dashboard</a></p>
    </div>
</main>
</body>
</html>
