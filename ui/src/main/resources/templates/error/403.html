<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <div class="error-page">
        <div class="code">403</div>
        <h1>You don't have access to this</h1>
        <p>The API reports that your account is not authorized for this action.</p>
        <p class="detail" th:text="${detail}">Detail</p>
        <p><a th:href="@{/dashboard}">Back to dashboard</a></p>
    </div>
</main>
</body>
</html>
