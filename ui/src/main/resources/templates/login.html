<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container">
    <div class="auth-container">
        <h1>Sign in</h1>
        <div th:replace="~{fragments/alerts :: messages}"></div>

        <form method="post" th:action="@{/login}" th:object="${loginForm}">
            <input type="hidden" th:if="${redirectTo}" name="redirectTo" th:value="${redirectTo}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" th:field="*{username}" th:errorclass="input-error" autofocus="autofocus"/>
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Invalid</p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" th:errorclass="input-error"/>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Invalid</p>
            </div>

            <p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Invalid credentials</p>

            <div class="actions">
                <button type="submit">Sign in</button>
            </div>
        </form>

        <p class="hint">
            No account yet? <a th:href="@{/register}">Register</a> ·
            New organization? <a th:href="@{/organizations/bootstrap}">Create one</a>
        </p>
    </div>
</main>
</body>
</html>
