spring:
  application:
    name: prompt-db-ui

  thymeleaf:
    cache: false

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8083}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PROMPT_DB_UI_SESSION
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
    connect-timeout: 5s
    read-timeout: 15s

logging:
  level:
    com.example.promptdb: INFO
